<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - SiGeRU</title>
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body class="cuerpo-formulario">
    <div class="contenedor-formulario">
      <div class="cabecera-formulario">
        <div class="logo-reciclaje" aria-hidden="true">♻️</div>
        <h2>Iniciar Sesión</h2>
        <p>Accede al panel de control de SiGeRU</p>
        <div class="usuarios-prueba" role="note">
          <strong>Usuarios de prueba</strong>
          <span>Vecino: vecino@sigeru.uy | Contraseña: vecino123</span>
          <span>Administrador: admin@sigeru.uy | Contraseña: admin123</span>
        </div>
      </div>

      <p id="aviso-registro" role="status"></p>
      <form id="form-login">
        <div class="grupo-campo">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="ejemplo@sigeru.com"
            class="campo-entrada"
            required
          />
        </div>

        <div class="grupo-campo">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            class="campo-entrada"
            required
          />
        </div>

        <button type="submit" id="btn-submit" class="boton-formulario">
          Entrar al Sistema
        </button>
      </form>

      <div class="enlaces-retorno">
        <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        <p style="margin-top: 10px">
          <a href="principal.html">← Volver al inicio</a>
        </p>
      </div>
    </div>

    <script>
      if (new URLSearchParams(location.search).get("registro") === "pendiente")
        document.getElementById("aviso-registro").textContent =
          "Solicitud enviada. Un administrador debe aprobar tu cuenta antes de iniciar sesión.";
      document
        .getElementById("form-login")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const btn = document.getElementById("btn-submit");

          if (
            !email ||
            email.length > 100 ||
            !password ||
            password.length > 72
          ) {
            alert("Completá un email válido y la contraseña.");
            return;
          }
          const originalText = btn.innerHTML;

          btn.innerHTML = '<span class="spinner"></span> Verificando...';
          btn.style.opacity = "0.8";
          btn.disabled = true;

          fetch("../Backend/api/usuarios/login.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.status === "success") {
                btn.innerHTML = '<span class="spinner"></span> Iniciando...';
                const rol = String(data.usuario?.rol || "")
                  .trim()
                  .toLowerCase();
                const destino = ["administrador", "admin"].includes(rol)
                  ? "backoffice.html"
                  : "panel.html";
                window.location.replace(destino);
              } else {
                alert(data.message);
                btn.innerHTML = originalText;
                btn.style.opacity = "1";
                btn.disabled = false;
              }
            })
            .catch((error) => {
              console.error("Error:", error);
              alert("No se pudo establecer conexión con el servidor.");
              btn.innerHTML = originalText;
              btn.style.opacity = "1";
              btn.disabled = false;
            });
        });
    </script>
  </body>
</html>
