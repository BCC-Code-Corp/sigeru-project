<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - SiGeRU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cuerpo-panel">

    <!-- Barra lateral de navegación (Ocultable y estructurada de forma vertical) -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <!-- Sección del perfil modificable con compresión de imagen -->
            <div class="perfil-contenedor">
                <label for="input-avatar" class="avatar-label">
                    <img id="avatar-img" src="https://picsum.photos/100" alt="Avatar Usuario" class="avatar-usuario">
                    <span class="editar-foto-badge">✏️</span>
                </label>
                <input type="file" id="input-avatar" accept="image/*" style="display: none;">
            </div>
            <h4 id="sidebar-nombre">Usuario</h4>
        </div>

        <nav class="sidebar-menu">
            <a href="#" class="item-menu activo">📊 Vista General</a>
            <a href="#" class="item-menu">🚛 Rutas de Camiones</a>
            <a href="#" class="item-menu">🗑️ Contenedores</a>
            <a href="#" class="item-menu">⚠️ Incidencias</a>
            <a href="#" class="item-menu">⚙️ Configuración</a>
        </nav>

        <div class="sidebar-footer">
            <a href="principal.html" onclick="localStorage.removeItem('sesion_activa')" class="item-menu cerrar-sesion">🚪 Cerrar Sesión</a>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="contenido-panel">
        <header class="barra-superior-panel">
            <!-- Botón para ocultar/mostrar el menú -->
            <button id="toggle-sidebar" class="btn-toggle">☰ Menú</button>
            <div class="logo-panel">♻️ SiGeRU</div>
        </header>

        <section class="seccion-bienvenida">
            <h1 id="texto-bienvenida" class="bienvenida-fade">¡Bienvenido!</h1>
            <p class="subtitulo-bienvenida">Tu sistema de control ambiental está listo y al día.</p>
        </section>

        <!-- Espacio de trabajo del Panel (En blanco para futuras funciones) -->
        <div class="espacio-trabajo"></div>
    </main>

    <script>
        // Cargar datos de la sesión guardada
        const sesion = JSON.parse(localStorage.getItem('sesion_activa'));
        const textoBienvenida = document.getElementById('texto-bienvenida');
        const sidebarNombre = document.getElementById('sidebar-nombre');

        if (sesion && sesion.nombre) {
            textoBienvenida.innerText = `¡Bienvenido, ${sesion.nombre}!`;
            sidebarNombre.innerText = sesion.nombre;
        } else {
            textoBienvenida.innerText = `¡Bienvenido, Operario!`;
        }

        // Mostrar / Ocultar Sidebar
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-sidebar');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('oculto');
        });

        // Modificar Foto de Perfil con compresión y recorte automático a un tamaño de 100x100px
        const inputAvatar = document.getElementById('input-avatar');
        const avatarImg = document.getElementById('avatar-img');

        const avatarGuardado = localStorage.getItem('avatar_usuario');
        if (avatarGuardado) {
            avatarImg.src = avatarGuardado;
        }

        inputAvatar.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        // Creación de un canvas para redimensionar y recortar la imagen de manera perfecta
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Definir tamaño de perfil estricto (100x100px)
                        const size = 100;
                        canvas.width = size;
                        canvas.height = size;

                        // Calcular recorte cuadrado proporcional
                        const minDim = Math.min(img.width, img.height);
                        const sx = (img.width - minDim) / 2;
                        const sy = (img.height - minDim) / 2;

                        // Dibujar la imagen recortada en el canvas
                        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);

                        // Exportar imagen optimizada en formato JPEG de bajo peso
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        avatarImg.src = dataUrl;
                        localStorage.setItem('avatar_usuario', dataUrl);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
