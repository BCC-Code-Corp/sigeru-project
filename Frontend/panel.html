<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - SiGeRU</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos internos para tablas y formularios dinámicos */
        .tabla-api { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .tabla-api th, .tabla-api td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .tabla-api th { background-color: #166534; color: white; font-weight: 600; }
        .tabla-api tr:hover { background-color: #f8fafc; }
        .formulario-interno { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 20px; }
        .flex-inputs { display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
        .btn-mini { background: #166534; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-mini:hover { background: #22c55e; }
        .badge-rol { display: inline-block; padding: 4px 8px; background: #e2e8f0; color: #334155; border-radius: 12px; font-size: 0.75rem; font-weight: bold; margin-top: 5px; text-transform: uppercase; }
        .seccion-privada { border-left: 4px solid #dc2626; padding-left: 10px; margin-bottom: 10px; }
    </style>
</head>
<body class="cuerpo-panel">

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="perfil-contenedor">
                <label for="input-avatar" class="avatar-label">
                    <img id="avatar-img" src="https://picsum.photos/100" alt="Avatar Usuario" class="avatar-usuario">
                    <span class="editar-foto-badge">✏️</span>
                </label>
                <input type="file" id="input-avatar" accept="image/*" style="display: none;">
            </div>
            <h4 id="sidebar-nombre">Usuario</h4>
            <!-- Badge dinámico que muestra el rango en la interfaz -->
            <span id="sidebar-rol" class="badge-rol">Invitado</span>
        </div>

        <nav class="sidebar-menu">
            <a href="#" id="menu-vista" class="item-menu activo">📊 Vista General</a>
            <a href="#" id="menu-contenedores" class="item-menu">🗑️ Ver Contenedores</a>
            <a href="#" id="menu-incidencias" class="item-menu">⚠️ Reportar Incidencia</a>
            
            <!-- SECCIÓN EXCLUSIVA DE BACKOFFICE (ADMINISTRACIÓN / OPERADORES) -->
            <div id="seccion-backoffice" class="seccion-privada" style="display: none;">
                <span style="font-size: 0.7rem; color: #94a3b8; font-weight: bold; padding-left: 15px; text-transform: uppercase;">Backoffice</span>
                <a href="#" id="menu-camiones" class="item-menu"> Bertram 🚛 Control de Flota</a>
            </div>
        </nav>

        <div class="sidebar-footer">
            <a href="principal.html" onclick="localStorage.removeItem('sesion_activa')" class="item-menu cerrar-sesion">🚪 Cerrar Sesión</a>
        </div>
    </aside>

    <main class="contenido-panel">
        <header class="barra-superior-panel">
            <button id="toggle-sidebar" class="btn-toggle">☰ Menú</button>
            <div class="logo-panel">♻️ SiGeRU</div>
        </header>

        <section class="seccion-bienvenida">
            <h1 id="texto-bienvenida" class="bienvenida-fade">¡Bienvenido!</h1>
            <p class="subtitulo-bienvenida">Tu sistema de control ambiental está listo y al día.</p>
        </section>

        <!-- Espacio de trabajo dinámico enlazado a las APIs -->
        <div id="espacio-trabajo" class="espacio-trabajo" style="padding: 25px; border: none; background: transparent;">
            <div style="background-color: white; border-radius: 12px; border: 2px dashed #cbd5e1; height: 100%; min-height: 300px;"></div>
        </div>
    </main>

    <script>
        // 1. CONTROL DE PERMISOS Y ROLES DESDE LA SESIÓN
        const sesion = JSON.parse(localStorage.getItem('sesion_activa'));
        const textoBienvenida = document.getElementById('texto-bienvenida');
        const sidebarNombre = document.getElementById('sidebar-nombre');
        const sidebarRol = document.getElementById('sidebar-rol');
        const seccionBackoffice = document.getElementById('seccion-backoffice');

        // Por defecto asumimos rango básico si no hay sesión iniciada
        let rangoUsuario = 'usuario'; 

        if (sesion) {
            textoBienvenida.innerText = `¡Bienvenido, ${sesion.nombre}!`;
            sidebarNombre.innerText = sesion.nombre;
            
            // Validamos si la API nos devolvió un rol específico, si no asignamos 'usuario'
            rangoUsuario = sesion.rol ? sesion.rol.toLowerCase() : 'usuario';
            sidebarRol.innerText = rangoUsuario;

            // REGLA DE BACKOFFICE: Si es Administrador u Operador, habilitamos herramientas de gestión avanzada
            if (rangoUsuario === 'admin' || rangoUsuario === 'operador') {
                seccionBackoffice.style.display = 'block';
            }
        }

        // Sidebar comportamiento visual
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-sidebar');
        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('oculto'));

        // CONTROL DE INTERFACES DINÁMICAS (Consumo de APIs y Endpoints)
        const espacio = document.getElementById('espacio-trabajo');
        const linksMenu = document.querySelectorAll('.item-menu');

        function removerActivos() {
            linksMenu.forEach(link => link.classList.remove('activo'));
        }

        // A. Vista General (Página de inicio del panel)
        document.getElementById('menu-vista').addEventListener('click', function(e) {
            e.preventDefault();
            removerActivos();
            this.classList.add('activo');
            espacio.innerHTML = `<div style="background-color: white; border-radius: 12px; border: 2px dashed #cbd5e1; height: 100%; min-height: 300px; display: flex; align-items: center; justify-content: center; color: #64748b;">Selecciona una opción del menú lateral para comenzar.</div>`;
        });

        // B. Módulo de Contenedores (Disponible para todos los rangos)
        document.getElementById('menu-contenedores').addEventListener('click', function(e) {
            e.preventDefault();
            removerActivos();
            this.classList.add('activo');
            cargarModuloContenedores();
        });

        function cargarModuloContenedores() {
            // Estructura condicional: Solo los encargados del backoffice ven el formulario de añadir contenedores
            let formularioAlta = '';
            if (rangoUsuario === 'admin' || rangoUsuario === 'operador') {
                formularioAlta = `
                    <div class="formulario-interno">
                        <h3>🗑️ [Backoffice] Añadir Contenedor Urbano</h3>
                        <form id="form-contenedor" class="flex-inputs">
                            <input type="text" id="ubicacion" placeholder="Dirección o Coordenadas" class="campo-entrada" style="width: auto; flex: 2;" required>
                            <select id="estado" class="campo-entrada" style="width: auto; flex: 1;">
                                <option value="vacio">Vacío</option>
                                <option value="lleno">Lleno</option>
                                <option value="mantenimiento">Mantenimiento</option>
                            </select>
                            <button type="submit" class="btn-mini">Añadir</button>
                        </form>
                    </div>`;
            }

            espacio.innerHTML = `
                ${formularioAlta}
                <h3>📍 Mapa de Monitoreo de Contenedores</h3>
                <div id="tabla-contenedores-contenedor">Conectando con el endpoint de contenedores...</div>
            `;

            // Si el formulario existe, activamos su escucha técnica hacia la API
            if (document.getElementById('form-contenedor')) {
                document.getElementById('form-contenedor').addEventListener('submit', function(evt) {
                    evt.preventDefault();
                    const ubicacion = document.getElementById('ubicacion').value;
                    const estado = document.getElementById('estado').value;

                    fetch('../Backend/contenedores.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ubicacion, estado })
                    })
                    .then(res => res.json())
                    .then(resData => {
                        alert(resData.message);
                        if(resData.status === 'success') cargarModuloContenedores();
                    });
                });
            }

            // Consumo del Endpoint de lectura pública
            fetch('../Backend/contenedores.php')
            .then(res => res.json())
            .then(resData => {
                if(resData.status === 'success' && resData.data.length > 0) {
                    let html = `<table class="tabla-api"><tr><th>ID</th><th>Ubicación de Contenedor</th><th>Estado Actual</th></tr>`;
                    resData.data.forEach(cnt => {
                        let colorEstado = cnt.estado === 'lleno' ? 'color: #dc2626;' : (cnt.estado === 'mantenimiento' ? 'color: #d97706;' : 'color: #16a34a;');
                        html += `<tr><td>#${cnt.id}</td><td>${cnt.ubicacion}</td><td style="${colorEstado} font-weight: bold;">${cnt.estado.toUpperCase()}</td></tr>`;
                    });
                    html += `</table>`;
                    document.getElementById('tabla-contenedores-contenedor').innerHTML = html;
                } else {
                    document.getElementById('tabla-contenedores-contenedor').innerHTML = '<p>No hay contenedores registrados en la zona.</p>';
                }
            });
        }

        // C. Módulo de Camiones (EXCLUSIVO BACKOFFICE)
        document.getElementById('menu-camiones').addEventListener('click', function(e) {
            e.preventDefault();
            removerActivos();
            this.classList.add('activo');
            cargarModuloCamiones();
        });

        function cargarModuloCamiones() {
            espacio.innerHTML = `
                <div class="formulario-interno">
                    <h3>🚚 Registrar Nuevo Vehículo de Flota</h3>
                    <form id="form-camion" class="flex-inputs">
                        <input type="text" id="matricula" placeholder="Matrícula (ej: ABC 1234)" class="campo-entrada" style="width: auto; flex: 1;" required>
                        <input type="number" step="0.01" id="capacidad" placeholder="Capacidad Carga (toneladas)" class="campo-entrada" style="width: auto; flex: 1;" required>
                        <button type="submit" class="btn-mini">Guardar en BDD</button>
                    </form>
                </div>
                <h3>Listado de Flota Logística</h3>
                <div id="tabla-camiones-contenedor">Conectando con el endpoint de camiones...</div>
            `;

            document.getElementById('form-camion').addEventListener('submit', function(evt) {
                evt.preventDefault();
                const matricula = document.getElementById('matricula').value;
                const capacidad_carga = document.getElementById('capacidad').value;

                fetch('../Backend/camiones.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ matricula, capacidad_carga })
                })
                .then(res => res.json())
                .then(resData => {
                    alert(resData.message);
                    if(resData.status === 'success') cargarModuloCamiones();
                });
            });

            fetch('../Backend/camiones.php')
            .then(res => res.json())
            .then(resData => {
                if(resData.status === 'success' && resData.data.length > 0) {
                    let html = `<table class="tabla-api"><tr><th>ID del Móvil</th><th>Matrícula Oficial</th><th>Capacidad Máxima</th></tr>`;
                    resData.data.forEach(c => {
                        html += `<tr><td>#${c.id}</td><td><strong>${c.matricula}</strong></td><td>${c.capacidad_carga} Toneladas</td></tr>`;
                    });
                    html += `</table>`;
                    document.getElementById('tabla-camiones-contenedor').innerHTML = html;
                } else {
                    document.getElementById('tabla-camiones-contenedor').innerHTML = '<p>No hay camiones registrados en la flota de forma persistente.</p>';
                }
            });
        }

        // Módulo estático de Incidencias (Demostrativo de cara al Frontend de usuario)
        document.getElementById('menu-incidencias').addEventListener('click', function(e) {
            e.preventDefault();
            removerActivos();
            this.classList.add('activo');
            espacio.innerHTML = `
                <div class="formulario-interno">
                    <h3>⚠️ Reportar Incidencia de Limpieza Urbana</h3>
                    <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 15px;">Envía reportes sobre contenedores desbordados, roturas o problemas en la recolección.</p>
                    <form class="flex-inputs" style="flex-direction: column; gap: 10px;" onsubmit="evt => evt.preventDefault(); alert('Reporte ciudadano enviado con éxito.');">
                        <input type="text" placeholder="Asunto del reporte" class="campo-entrada" required>
                        <textarea placeholder="Describe el problema y proporciona referencias visuales..." class="campo-entrada" style="min-height: 80px; font-family: inherit; padding: 10px;" required></textarea>
                        <button type="button" onclick="alert('Incidencia registrada de forma simulada.')" class="btn-mini" style="align-self: flex-start;">Enviar Reporte</button>
                    </form>
                </div>`;
        });

        // Lógica de manipulación de Avatar en LocalStorage
        const inputAvatar = document.getElementById('input-avatar');
        const avatarImg = document.getElementById('avatar-img');
        const avatarGuardado = localStorage.getItem('avatar_usuario');
        if (avatarGuardado) avatarImg.src = avatarGuardado;

        inputAvatar.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const size = 100;
                        canvas.width = size; canvas.height = size;
                        const minDim = Math.min(img.width, img.height);
                        const sx = (img.width - minDim) / 2;
                        const sy = (img.height - minDim) / 2;
                        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        avatarImg.src = dataUrl;
                        localStorage.setItem('avatar_usuario', dataUrl);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
