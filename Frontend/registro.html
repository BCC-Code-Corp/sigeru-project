<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - SiGeRU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cuerpo-formulario">

    <div class="contenedor-formulario">
        <div class="cabecera-formulario">
            <div class="logo-reciclaje">🌱</div>
            <h2>Crear Cuenta</h2>
            <p>Regístrate para gestionar reportes y servicios</p>
        </div>

        <form id="form-registro">
            <div class="grupo-campo">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Juan Pérez" class="campo-entrada" required>
            </div>

            <div class="grupo-campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@sigeru.com" class="campo-entrada" required>
            </div>

            <div class="grupo-campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" class="campo-entrada" required>
            </div>

            <button type="submit" id="btn-submit" class="boton-formulario">Registrarme</button>
        </form>

        <div class="enlaces-retorno">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            <p style="margin-top: 10px;"><a href="principal.html">← Volver al inicio</a></p>
        </div>
    </div>

    <script>
        document.getElementById('form-registro').addEventListener('submit', function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');

            // Simulación de Base de Datos relacional usando una lista en localStorage
            let usuariosGuardados = JSON.parse(localStorage.getItem('usuarios_db')) || [];

            // VALIDACIÓN DE DUPLICADO (Evita registrar el mismo correo)
            const existeCorreo = usuariosGuardados.some(u => u.email === email);
            if (existeCorreo) {
                alert('Este correo electrónico ya está registrado.');
                return;
            }

            // Registrar nuevo usuario
            const nuevoUsuario = { nombre: nombre, email: email, password: password };
            usuariosGuardados.push(nuevoUsuario);
            localStorage.setItem('usuarios_db', JSON.stringify(usuariosGuardados));

            // Feedback visual animado en botón
            btn.innerHTML = '<span class="spinner"></span> Creando cuenta...';
            btn.style.opacity = '0.8';
            btn.disabled = true;

            setTimeout(() => {
                localStorage.setItem('sesion_activa', JSON.stringify(nuevoUsuario));
                window.location.href = 'panel.html';
            }, 1000);
        });
    </script>
</body>
</html>
