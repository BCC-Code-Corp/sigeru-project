<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - SiGeRU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cuerpo-formulario">

    <div class="contenedor-formulario">
        <div class="cabecera-formulario">
            <div class="logo-reciclaje">🌱</div>
            <h2>Crear Cuenta</h2>
            <p>Regístrate para gestionar reportes y servicios</p>
        </div>

        <form id="form-registro">
            <div class="grupo-campo">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Juan Pérez" class="campo-entrada" required>
            </div>

            <div class="grupo-campo">
                <label for="cedula">Cédula de Identidad</label>
                <input type="text" id="cedula" name="cedula" placeholder="1.234.567-8" class="campo-entrada" required>
            </div>

            <div class="grupo-campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@sigeru.com" class="campo-entrada" required>
            </div>

            <div class="grupo-campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" class="campo-entrada" required>
            </div>

            <button type="submit" id="btn-submit" class="boton-formulario">Registrarme</button>
        </form>

        <div class="enlaces-retorno">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            <p style="margin-top: 10px;"><a href="principal.html">← Volver al inicio</a></p>
        </div>
    </div>

    <script>
        // Validación de Cédula Uruguaya en el Frontend
        function validarCedulaUruguaya(ci) {
            const clean = ci.replace(/[^0-9]/g, '').padStart(8, '0');
            if (clean.length !== 8) return false;
            const factors = [2, 9, 8, 7, 6, 3, 4];
            let sum = 0;
            for (let i = 0; i < 7; i++) {
                sum += parseInt(clean[i]) * factors[i];
            }
            const rem = sum % 10;
            const check = (rem === 0) ? 0 : (10 - rem);
            return check === parseInt(clean[7]);
        }

        document.getElementById('form-registro').addEventListener('submit', function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value.trim();
            const cedula = document.getElementById('cedula').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');

            if (!validarCedulaUruguaya(cedula)) {
                alert('La Cédula de Identidad ingresada no es válida.');
                return;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner"></span> Procesando...';
            btn.style.opacity = '0.8';
            btn.disabled = true;

            fetch('../Backend/registro.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, cedula, email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    btn.innerHTML = '<span class="spinner"></span> Redirigiendo...';
                    localStorage.setItem('sesion_activa', JSON.stringify(data.usuario));
                    setTimeout(() => {
                        window.location.href = 'panel.html';
                    }, 1000);
                } else {
                    alert(data.message);
                    btn.innerHTML = originalText;
                    btn.style.opacity = '1';
                    btn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('No se pudo establecer conexión con el servidor.');
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
