<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex Frontend/principal.html
    ProxyRequests Off
    ProxyPass /Backend/api/usuarios/ http://usuarios/Backend/api/usuarios/
    ProxyPassReverse /Backend/api/usuarios/ http://usuarios/Backend/api/usuarios/
    ProxyPass /Backend/api/gestion/ http://gestion/Backend/api/gestion/
    ProxyPassReverse /Backend/api/gestion/ http://gestion/Backend/api/gestion/
    ProxyPass /Backend/api/recoleccion/ http://recoleccion/Backend/api/recoleccion/
    ProxyPassReverse /Backend/api/recoleccion/ http://recoleccion/Backend/api/recoleccion/
    <Directory /var/www/html>
        Require all granted
    </Directory>
</VirtualHost>
